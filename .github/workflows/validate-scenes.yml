name: التحقق من scenes.json

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  validate:
    name: فحص المخطط والمحاكاة
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: إعادة توليد scenes.json (يشمل فحص المخطط تلقائيًا)
        run: python3 build_scenes_json.py

      - name: التأكد من عدم وجود انحراف بين المصدر والملف الموجود في المستودع
        run: |
          if ! git diff --exit-code -- scenes.json; then
            echo ""
            echo "::error::scenes.json الموجود في المستودع لا يطابق نتيجة إعادة التوليد من build_scenes_json.py."
            echo "::error::شغّل 'python3 build_scenes_json.py' محليًا وارفع scenes.json المُحدَّث."
            exit 1
          fi

      - name: فحص شامل (بنية المخطط + منطق النهايات بمحاكاة كاملة)
        run: python3 validate_scenes_json.py
